name: Deploy to Play Store

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Platform 37
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "Copying android-37.0 to android-37 and adjusting package.xml/source.properties..."
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            if [ -f "$ANDROID_HOME/platforms/android-37/package.xml" ]; then
              sed -i 's/path="platforms;android-37.0"/path="platforms;android-37"/g' "$ANDROID_HOME/platforms/android-37/package.xml"
              sed -i 's/<api-level>37.0<\/api-level>/<api-level>37<\/api-level>/g' "$ANDROID_HOME/platforms/android-37/package.xml"
            fi
            if [ -f "$ANDROID_HOME/platforms/android-37/source.properties" ]; then
              sed -i 's/Platform.Version=17.0/Platform.Version=17/g' "$ANDROID_HOME/platforms/android-37/source.properties"
              sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
            fi
          fi
          ls -la "$ANDROID_HOME/platforms"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release App Bundle
        run: ./gradlew bundleRelease

      - name: Sign Android Release
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: warn

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.watchmymoney
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: wear:internal
